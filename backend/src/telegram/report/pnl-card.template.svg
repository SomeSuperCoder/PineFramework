<!--
  ============================================================================
  PINE FRAMEWORK — GLOBAL PNL CARD  (800 x 440, rendered by sharp -> librsvg)
  ============================================================================
  This is a STATIC template. Placeholders are written as double curly braces
  wrapping a name (for example totalPnl, symbolRows). The file is safe to paste
  verbatim into a TS template literal: no backticks, and no dollar-brace
  interpolation sequences anywhere, including inside this comment.

  PLACEHOLDERS (backend injects values AND colors — SVG cannot branch):
    {{totalPnl}} {{realizedPnl}} {{unrealizedPnl}}
    {{winRate}} {{profitFactor}} {{avgTrade}} {{maxDrawdown}} {{openPositions}}
    {{engineState}} {{generatedAt}} {{symbolRows}}
    {{headlineColor}} {{realizedColor}} {{unrealizedColor}}
    {{avgTradeColor}} {{maxDrawdownColor}}
    {{engineStateColor}} {{engineStateBg}}

  SIGN RULE (one rule, applied everywhere):
    pnl >= 0  -> green   text #35D07F   bar gradient url(#gradGreen)  #3BEC8E to #0FAE72
    pnl <  0  -> red     text #F6465D   bar gradient url(#gradRed)    #FF7A85 to #E53950
    no trades -> neutral text #A6AEBF on every value; symbolRows replaced by EMPTY STATE group.

  ENGINE STATE:
    Running -> color #35D07F  bg rgba(53,208,127,0.14)
    Stopped -> color #F59E0B  bg rgba(245,158,11,0.14)
    Error   -> color #F6465D  bg rgba(246,70,93,0.14)

  PER-SYMBOL BAR ROW (repeat {{symbolRows}} per symbol):
    Row height 22, gap 4, step 26. Row i vertical center cy = 201 + i * 26  (i = 0..5).
    Track:      rect x=152 y=cy-4 w=480 h=8 rx=4 fill rgba(255,255,255,0.05)
    Axis:       x = 392 (center of track), max half width = 240
    Formula:    w = max(3, round( |pnl| / maxAbsPnl * 240 ))   when |pnl| > 0; w = 0 when pnl = 0
                where maxAbsPnl = max( |pnl_1..n| ) across the rows being drawn.
    Positive:   path M 392 cy-4 L 392+w-4 cy-4 Q 392+w cy-4 392+w cy Q 392+w cy+4 392+w-4 cy+4 L 392 cy+4 Z
                fill url(#gradGreen)   value text fill rowColor = #35D07F
    Negative:   path M 392 cy-4 L 392-w+4 cy-4 Q 392-w cy-4 392-w cy Q 392-w cy+4 392-w+4 cy+4 L 392 cy+4 Z
                fill url(#gradRed)     value text fill rowColor = #F6465D
    Zero:       circle cx=392 cy r=2.5 fill #5E6678, value text fill #A6AEBF
    Value text: x=768 text-anchor=end baseline y=cy+4.5, mono 13px weight 700.
    Symbol:     x=32  baseline y=cy+4.5, mono 13px weight 600 fill #C6CDDB.

  EXAMPLE ROW (i=0, cy=201) — positive:
  <g>
    <text x="32" y="205.5" font-size="13" font-weight="600" fill="#C6CDDB" font-family="'JetBrains Mono', 'SF Mono', 'Roboto Mono', 'Fira Code', 'Cascadia Mono', Consolas, 'Liberation Mono', Menlo, monospace">BTCUSDT</text>
    <rect x="152" y="197" width="480" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.05"/>
    <path d="M 392 197 L 588 197 Q 592 197 592 201 Q 592 205 588 205 L 392 205 Z" fill="url(#gradGreen)"/>
    <text x="768" y="205.5" text-anchor="end" font-size="13" font-weight="700" fill="#35D07F" font-family="'JetBrains Mono', 'SF Mono', 'Roboto Mono', 'Fira Code', 'Cascadia Mono', Consolas, 'Liberation Mono', Menlo, monospace">+$1,284.50</text>
  </g>

  EMPTY STATE (zero trades): replace {{symbolRows}} with this single group, and
  inject all value colors as #A6AEBF (headline, split, avgTrade, maxDrawdown):
  <g>
    <text x="392" y="266" text-anchor="middle" font-size="13" font-weight="500" fill="#6B7386">No trades yet — awaiting the first signal</text>
  </g>
  ============================================================================
-->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0E16"/>
      <stop offset="1" stop-color="#101726"/>
    </linearGradient>
    <radialGradient id="glowGreen" cx="0.12" cy="0" r="1.1" fx="0.12" fy="0">
      <stop offset="0" stop-color="#35D07F" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#35D07F" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#35D07F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" opacity="0.035"/>
    </pattern>
    <linearGradient id="gradGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3BEC8E"/>
      <stop offset="1" stop-color="#0FAE72"/>
    </linearGradient>
    <linearGradient id="gradRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A85"/>
      <stop offset="1" stop-color="#E53950"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background: deep navy gradient + faint green glow + dotted grid + hairline border -->
  <rect width="800" height="440" fill="url(#bgGrad)"/>
  <rect width="800" height="440" fill="url(#glowGreen)"/>
  <rect width="800" height="440" fill="url(#dotGrid)"/>
  <rect x="0.5" y="0.5" width="799" height="439" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>

  <!-- Header: brand eyebrow (left) + engine state pill (right) -->
  <g>
    <rect x="32" y="33" width="6" height="6" rx="3" fill="url(#gradGreen)"/>
    <text x="44" y="41" font-size="11" font-weight="700" letter-spacing="2.2" fill="#8A93A6">PINE FRAMEWORK</text>

    <rect x="668" y="28" width="100" height="22" rx="11" fill="{{engineStateBg}}" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="688" cy="39" r="3" fill="{{engineStateColor}}"/>
    <text x="700" y="43.5" font-size="11" font-weight="600" fill="{{engineStateColor}}">{{engineState}}</text>
  </g>

  <!-- Headline zone: Global PnL hero number (left) + Realized/Unrealized split panel (right) -->
  <g>
    <text x="32" y="78" font-size="12" font-weight="700" letter-spacing="2.4" fill="#8A93A6">GLOBAL PNL</text>
    <text x="32" y="124" font-size="46" font-weight="800" letter-spacing="-1" fill="{{headlineColor}}" font-family="'JetBrains Mono', 'SF Mono', 'Roboto Mono', 'Fira Code', 'Cascadia Mono', Consolas, 'Liberation Mono', Menlo, monospace">{{totalPnl}}</text>
    <text x="32" y="146" font-size="11.5" font-weight="500" fill="#6B7386">Net realized + unrealized across all symbols</text>

    <rect x="486" y="62" width="282" height="84" rx="16" fill="url(#panelGrad)" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <line x1="627" y1="74" x2="627" y2="134" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="556.5" y="84" font-size="10" font-weight="700" letter-spacing="1.2" fill="#6B7386" text-anchor="middle">REALIZED</text>
    <g font-family="'JetBrains Mono', 'SF Mono', 'Roboto Mono', 'Fira Code', 'Cascadia Mono', Consolas, 'Liberation Mono', Menlo, monospace">
      <text x="556.5" y="122" font-size="20" font-weight="700" fill="{{realizedColor}}" text-anchor="middle">{{realizedPnl}}</text>
      <text x="697.5" y="122" font-size="20" font-weight="700" fill="{{unrealizedColor}}" text-anchor="middle">{{unrealizedPnl}}</text>
    </g>
    <text x="697.5" y="84" font-size="10" font-weight="700" letter-spacing="1.2" fill="#6B7386" text-anchor="middle">UNREALIZED</text>
  </g>

  <!-- Per-symbol section header -->
  <g>
    <text x="32" y="174" font-size="11" font-weight="700" letter-spacing="2" fill="#8A93A6">SYMBOL PNL</text>
    <text x="768" y="174" font-size="10.5" font-weight="500" fill="#5E6678" text-anchor="end">TOP MOVERS · |PnL|</text>
  </g>

  <!-- Per-symbol bars: backend generates 0..6 row groups (see comment header for
       formula + example) and injects them here. Row i vertical center cy = 201 + i*26. -->
  <g id="symbol-rows">{{symbolRows}}</g>

  <!-- Footer metrics strip -->
  <g>
    <rect x="32" y="356" width="736" height="40" rx="14" fill="url(#panelGrad)" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <g font-size="10" font-weight="700" letter-spacing="1" fill="#6B7386" text-anchor="middle">
      <text x="105.6" y="374">WIN RATE</text>
      <text x="252.8" y="374">PROFIT FACTOR</text>
      <text x="400" y="374">AVG TRADE</text>
      <text x="547.2" y="374">MAX DRAWDOWN</text>
      <text x="694.4" y="374">OPEN POSITIONS</text>
    </g>
    <g font-size="15" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Roboto Mono', 'Fira Code', 'Cascadia Mono', Consolas, 'Liberation Mono', Menlo, monospace">
      <text x="105.6" y="390" fill="#E6E9F0">{{winRate}}</text>
      <text x="252.8" y="390" fill="#E6E9F0">{{profitFactor}}</text>
      <text x="400" y="390" fill="{{avgTradeColor}}">{{avgTrade}}</text>
      <text x="547.2" y="390" fill="{{maxDrawdownColor}}">{{maxDrawdown}}</text>
      <text x="694.4" y="390" fill="#E6E9F0">{{openPositions}}</text>
    </g>
  </g>

  <!-- Footer meta: generated-at timestamp (left) + brand (right) -->
  <g>
    <text x="32" y="414" font-size="10.5" font-weight="500" fill="#5E6678" font-family="'JetBrains Mono', 'SF Mono', 'Roboto Mono', 'Fira Code', 'Cascadia Mono', Consolas, 'Liberation Mono', Menlo, monospace">Generated {{generatedAt}}</text>
    <text x="768" y="414" font-size="10.5" font-weight="500" fill="#5E6678" text-anchor="end">PineFramework · automated report</text>
  </g>
</svg>

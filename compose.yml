services:
  backend:
    build:
      context: .
      dockerfile: backend/Containerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - frontend
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Containerfile
    ports:
      - "80:80"
    restart: unless-stopped

services:
  backend:
    build:
      context: .
      dockerfile: backend/Containerfile
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
    depends_on:
      - frontend
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Containerfile
    ports:
      - "80:80"
    restart: unless-stopped
